<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salons du livre</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="deco" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="img/logo.png" alt="" width="46" height="40">
      <div>
        <div class="brand-name">Salons du livre</div>
        <p class="sub">Suivi partagé des salons &amp; inscriptions</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" hidden>
      <button data-view="salons" class="active">Salons</button>
      <button data-view="sources">Sources</button>
      <button data-view="ia">✨ Recherche IA</button>
    </nav>
    <div class="user" id="userBox"></div>
  </header>

  <section class="hero">
    <h1 id="heroTitle">Salons du livre</h1>
    <p id="banner"></p>
  </section>
  <main id="main"><div class="loading">Chargement…</div></main>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
